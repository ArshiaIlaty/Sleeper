<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhysioNet 2026 — Biosignal Viewer</title>
<link rel="icon" type="image/png" href="/static/edwards_logo.png">
<link rel="apple-touch-icon" href="/static/edwards_logo.png">
<style>
  /* Validated Edwards palette (dataviz color checks): red #C8102E / blue #2166a0 */
  :root{
    --surface:#fcfcfb; --panel:#ffffff; --ink:#0b0b0b; --ink2:#52514e;
    --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
    --red:#C8102E; --blue:#2166a0; --gold:#a6791f; --aqua:#1baf7a;
    --n3:#104281; --n2:#2a78d6; --n1:#5598e7; --wake:#9ec5f4; --rem:#C8102E;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
       background:var(--surface);color:var(--ink);font-size:14px;}
  header{background:var(--blue);color:#fff;padding:12px 20px;display:flex;
         align-items:center;gap:16px;}
  header h1{font-size:17px;margin:0;font-weight:700;}
  header .sub{opacity:.85;font-size:12.5px;}
  header .logo{background:#fff;border-radius:6px;padding:4px 7px;display:flex;
               align-items:center;height:34px;}
  header .logo img{height:26px;display:block;}
  /* hoverable-for-explanation affordance */
  .info{cursor:help;border-bottom:1px dotted currentColor;}
  .idx.info,.chip.info{border-bottom:none;}
  .idx[data-tip],.chip[data-tip],[data-tip]{cursor:help;}
  .tip{position:fixed;z-index:1000;max-width:320px;background:#12222c;color:#f4f7f8;
       font-size:12px;line-height:1.5;padding:9px 11px;border-radius:8px;
       box-shadow:0 6px 24px rgba(0,0,0,.28);pointer-events:none;opacity:0;
       transition:opacity .09s ease;}
  .tip.show{opacity:1;}
  .tip b{color:#8fc0e8;}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:0;height:calc(100vh - 50px);}
  aside{border-right:1px solid var(--border);overflow-y:auto;background:var(--panel);}
  .search{padding:10px;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border);}
  .search input{width:100%;padding:8px 10px;border:1px solid var(--axis);border-radius:6px;font-size:13px;}
  .plist{list-style:none;margin:0;padding:0;}
  .plist li{padding:8px 12px;border-bottom:1px solid var(--grid);cursor:pointer;
            display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .plist li:hover{background:#f0f6fd;}
  .plist li.active{background:#e3eefb;border-left:3px solid var(--blue);}
  .pid{font-family:ui-monospace,monospace;font-size:12px;}
  .pmeta{font-size:11px;color:var(--muted);white-space:nowrap;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .dot.ci{background:var(--red);} .dot.noci{background:var(--blue);}
  main{overflow-y:auto;padding:18px 22px;}
  .placeholder{color:var(--muted);text-align:center;margin-top:80px;font-size:15px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;
        padding:16px 18px;margin-bottom:16px;}
  .card h2{font-size:14px;margin:0 0 12px;font-weight:700;text-transform:uppercase;
           letter-spacing:.04em;color:var(--ink2);}
  .card h3{font-size:12px;margin:16px 0 8px;font-weight:700;text-transform:uppercase;
           letter-spacing:.03em;color:var(--muted);}
  /* stage-transition heatmap (patient vs cohort, sequential blue ramp) */
  .matrix{display:grid;gap:2px;font-size:11.5px;max-width:520px;}
  .matrix .mh{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;
              display:flex;align-items:center;justify-content:center;font-weight:700;}
  .matrix .mrl{font-size:11px;color:var(--ink2);font-weight:700;display:flex;
               align-items:center;justify-content:flex-end;padding-right:6px;}
  .matrix .mcell{border-radius:4px;height:38px;display:flex;align-items:center;
                 justify-content:center;font-variant-numeric:tabular-nums;font-weight:700;cursor:help;}
  .matrix .corner{font-size:9.5px;color:var(--muted);display:flex;align-items:flex-end;
                  justify-content:flex-end;padding:0 4px 3px 0;line-height:1.1;text-align:right;}
  .mcap{font-size:11px;color:var(--muted);margin:4px 0 0;}
  /* tabs (raw vs preprocessed staging) */
  .tabs{display:flex;gap:2px;border-bottom:2px solid var(--grid);margin:2px 0 12px;}
  .tabs button{border:none;background:none;padding:7px 14px;font-size:12.5px;font-weight:700;
               color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;
               font-family:inherit;letter-spacing:.02em;}
  .tabs button:hover{color:var(--ink2);}
  .tabs button.on{color:var(--blue);border-bottom-color:var(--blue);}
  .banner{background:#eef4fb;border:1px solid #cfe0f2;border-radius:8px;padding:9px 12px;
          font-size:12px;color:var(--ink2);margin-bottom:12px;line-height:1.5;}
  .banner b{color:var(--blue);}
  .banner .pill{display:inline-block;background:var(--blue);color:#fff;border-radius:10px;
                padding:1px 8px;font-weight:700;font-size:11px;margin-right:4px;}
  .hyp-label{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;
             letter-spacing:.03em;margin:14px 0 8px;}
  .hyp-label:first-child{margin-top:2px;}
  .hyp-label.clean{color:var(--blue);}
  /* value-vs-cohort dynamics tiles */
  .dyn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;}
  .dyn{background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:8px 10px;}
  .dyn .n{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
  .dyn .l{font-size:11px;color:var(--muted);}
  .dyn .c{font-size:10.5px;color:var(--muted);margin-top:3px;}
  .dyn.worse{background:#fdeff1;border-color:var(--red);}
  .dyn.worse .n{color:var(--red);}
  .dyn .arrow{font-weight:700;}
  .dyn .arrow.bad{color:var(--red);} .dyn .arrow.ok{color:var(--aqua);}
  .demo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 18px;}
  .demo-grid .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .demo-grid .v{font-size:15px;font-weight:600;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;}
  .badge.ci{background:var(--red);} .badge.noci{background:var(--blue);}
  .idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .idx{background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:8px 10px;position:relative;}
  .idx .n{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;}
  .idx .l{font-size:11px;color:var(--muted);}
  .idx .ref{font-size:10px;color:var(--muted);margin-top:2px;}
  /* abnormal (out-of-reference-range) values */
  .idx.abn{background:#fdeff1;border-color:var(--red);}
  .idx.abn .n{color:var(--red);}
  .abn-flag{display:inline-block;font-size:9px;font-weight:700;color:#fff;background:var(--red);
            border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;letter-spacing:.03em;}
  .legend .abn-val{color:var(--red);font-weight:700;}
  .stagebar{display:flex;height:34px;border-radius:6px;overflow:hidden;margin-bottom:6px;}
  .stagebar span{display:flex;align-items:center;justify-content:center;color:#fff;
                 font-size:11px;font-weight:700;border-right:2px solid var(--surface);}
  .legend{font-size:11.5px;color:var(--ink2);display:flex;gap:14px;flex-wrap:wrap;}
  .legend b{font-weight:700;}
  .chrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{padding:4px 10px;border:1px solid var(--axis);border-radius:16px;cursor:pointer;
        font-size:12px;background:var(--panel);user-select:none;}
  .chip.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  /* per-stage signal chunking */
  .ststat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
  .ststat{border:1px solid var(--grid);border-radius:8px;padding:8px 10px;border-left-width:4px;}
  .ststat .s{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .ststat .n{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}
  .ststat .sub{font-size:10.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;}
  .stepoch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
  .stepoch{border:1px solid var(--grid);border-radius:8px;padding:6px 8px 2px;border-top-width:3px;}
  .stepoch .h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
              display:flex;justify-content:space-between;align-items:baseline;}
  .stepoch .h .sub{font-size:10px;color:var(--muted);font-weight:400;}
  .bandbars{display:flex;flex-direction:column;gap:5px;margin:4px 0 8px;}
  .bandrow{display:flex;align-items:center;gap:8px;font-size:11px;}
  .bandrow .bl{width:44px;color:var(--ink2);text-transform:capitalize;}
  .bandrow .bt{flex:1;height:12px;background:var(--surface);border-radius:3px;overflow:hidden;}
  .bandrow .bt i{display:block;height:100%;background:var(--blue);border-radius:3px;}
  .bandrow .bv{width:44px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;}
  /* per-stage NeuroKit physiology card */
  .nk-sub{font-size:12px;color:var(--ink2);margin:0 0 12px;line-height:1.55;max-width:760px;}
  .nk-btn{font-size:12.5px;font-weight:700;padding:6px 16px;border-radius:6px;
          border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;font-family:inherit;}
  .nk-btn:hover{background:#1b5687;}
  .nk-btn:disabled{background:var(--muted);border-color:var(--muted);cursor:default;}
  .nk-used{font-size:11px;color:var(--muted);margin:2px 0 12px;font-variant-numeric:tabular-nums;}
  .nk-used b{color:var(--ink2);}
  /* per-stage metric table (stages as columns, features as rows) */
  .nktab{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;
         margin:2px 0 6px;}
  .nktab th,.nktab td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap;}
  .nktab thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:#fff;
                  border-bottom:none;border-radius:5px 5px 0 0;}
  .nktab tbody th{text-align:left;font-weight:700;color:var(--ink2);cursor:help;}
  .nktab .rowlab .u{font-weight:400;color:var(--muted);font-size:10.5px;}
  .nktab td.na{color:var(--muted);}
  .nktab tbody tr:hover td,.nktab tbody tr:hover th{background:#f7fafd;}
  /* cross-stage contrast tiles (the flagship CI signal) */
  .nk-contrast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;margin:4px 0 6px;}
  .nkc{background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:9px 11px;border-left:4px solid var(--gold);}
  .nkc .n{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
  .nkc .l{font-size:11px;color:var(--ink2);margin-top:2px;line-height:1.35;cursor:help;}
  /* clinical report card */
  .rep-tier{margin:6px 0 18px;}
  .rep-tier .th{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;}
  .rep-tier .th .badge{font-size:10px;padding:2px 9px;letter-spacing:.03em;}
  .rep-tier .th .badge.t1{background:var(--red);} .rep-tier .th .badge.t2{background:var(--blue);}
  .rep-tier .th .cap{font-size:11px;color:var(--muted);}
  .rep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .repc{background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:10px 12px;
        border-left:4px solid var(--axis);}
  .repc.t1{border-left-color:var(--red);} .repc.t2{border-left-color:var(--blue);}
  .repc .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
  .repc .n .u{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px;}
  .repc .l{font-size:11.5px;font-weight:700;color:var(--ink2);margin-top:2px;cursor:help;}
  .repc .note{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.35;}
  .repc .na{color:var(--muted);}
  /* clinical feature summary table */
  .reptab{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 6px;max-width:640px;}
  .reptab th,.reptab td{padding:7px 10px;border-bottom:1px solid var(--grid);text-align:left;}
  .reptab td.v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .reptab td.u{color:var(--muted);font-size:11px;width:64px;}
  .reptab th{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;}
  .reptab tbody tr:hover{background:#f7fafd;}
  .reptab .feat{cursor:help;}
  /* sleep-quality tiles */
  .sq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:2px 0 6px;}
  .sq{background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:8px 10px;}
  .sq .n{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .sq .l{font-size:10.5px;color:var(--muted);margin-top:2px;cursor:help;}
  .sq.abn{background:#fdeff1;border-color:var(--red);} .sq.abn .n{color:var(--red);}
  svg{display:block;width:100%;}
  .axis-label{font-size:10px;fill:var(--muted);}
  .sig-label{font-size:11px;font-weight:700;fill:var(--ink);}
  /* PSG signal plots + zoom */
  .sigwrap{position:relative;margin-bottom:6px;}
  .sigwrap svg{cursor:crosshair;}
  .sig-frame{fill:none;stroke:var(--axis);stroke-width:1;}
  .sig-brush{fill:rgba(33,101,160,.14);stroke:var(--blue);stroke-width:1;stroke-dasharray:3 2;}
  .sig-cross{stroke:var(--red);stroke-width:1;}
  .seam{stroke:var(--gold);stroke-width:1;stroke-dasharray:2 3;stroke-opacity:.7;}
  .sig-dot{fill:var(--red);stroke:#fff;stroke-width:1;}
  .sig-readout{font-size:10px;fill:var(--red);font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:2.5;}
  .sigbar{display:flex;align-items:center;gap:12px;margin:2px 0 10px;flex-wrap:wrap;}
  .sigbar .win{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;}
  .sigbar button{font-size:12px;font-weight:700;padding:4px 12px;border-radius:6px;
                 border:1px solid var(--axis);background:var(--panel);color:var(--blue);
                 cursor:pointer;font-family:inherit;}
  .sigbar button:hover{background:#f0f6fd;}
  .sigbar button:disabled{color:var(--muted);cursor:default;background:var(--panel);}
  .sigbar .zhint{font-size:11px;color:var(--muted);}
  .loading{color:var(--muted);font-size:13px;padding:10px 0;}
  .err{color:var(--red);font-size:13px;padding:8px 0;font-weight:600;}
  .hint{color:var(--muted);font-size:12px;margin-top:4px;}
  /* dataset selector in the header */
  header .ds{margin-left:auto;display:flex;align-items:center;gap:8px;}
  header .ds label{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.04em;}
  header .ds select{font-size:13px;font-weight:700;padding:5px 9px;border-radius:6px;
                    border:1px solid rgba(255,255,255,.4);background:#fff;color:var(--ink);
                    font-family:inherit;cursor:pointer;}
  .ds-note{background:#fff7e6;border:1px solid #f0d9a8;border-radius:8px;padding:9px 12px;
           font-size:12px;color:#7a5c12;margin-bottom:12px;line-height:1.5;}
</style>
</head>
<body>
<header>
  <span class="logo"><img src="/static/edwards_logo.png" alt="Edwards" onerror="this.parentNode.style.display='none'"></span>
  <h1>PhysioNet 2026 · Biosignal Viewer</h1>
  <span class="sub" id="cohort">loading…</span>
  <span class="ds"><label for="dsSel">Dataset</label>
    <select id="dsSel" title="Choose which cohort to analyze"></select></span>
</header>
<div id="tip" class="tip" role="tooltip" aria-hidden="true"></div>
<div class="layout">
  <aside>
    <div class="search"><input id="q" placeholder="Filter by patient ID / site…" autocomplete="off"></div>
    <ul class="plist" id="plist"></ul>
  </aside>
  <main id="main">
    <div class="placeholder">← Select a patient to view demographics, sleep staging, and PSG signals.</div>
  </main>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
let PATIENTS = [], CURRENT = null, SIGCACHE = {}, GLOSSARY = null;
let DATASETS = [], DATASET = "standard";   // selected cohort

async function jget(url){ const r = await fetch(url); return r.json(); }
// append the current dataset (+ optional extra query) to an API path
function api(path, extra){
  const parts = ["ds=" + encodeURIComponent(DATASET)];
  if(extra) parts.push(extra);
  return path + "?" + parts.join("&");
}

// ---- tooltip engine ----
// Any element with a data-tip attribute shows that text on hover/focus. One
// shared tooltip node, positioned near the cursor, kept on-screen.
const TIP = () => $("#tip");
function showTip(el, ev){
  const txt = el.getAttribute("data-tip"); if(!txt) return;
  const t = TIP(); t.innerHTML = txt; t.classList.add("show"); t.setAttribute("aria-hidden","false");
  moveTip(ev || el.getBoundingClientRect());
}
function moveTip(ev){
  const t = TIP(); const pad = 14;
  let x, y;
  if(ev && ev.clientX != null){ x = ev.clientX + pad; y = ev.clientY + pad; }
  else { x = (ev.left||0); y = (ev.bottom||0) + 6; }   // element rect fallback
  const w = t.offsetWidth, h = t.offsetHeight;
  if(x + w + 8 > window.innerWidth)  x = window.innerWidth  - w - 8;
  if(y + h + 8 > window.innerHeight) y = window.innerHeight - h - 8;
  if(x < 6) x = 6; if(y < 6) y = 6;
  t.style.left = x + "px"; t.style.top = y + "px";
}
function hideTip(){ const t = TIP(); t.classList.remove("show"); t.setAttribute("aria-hidden","true"); }
// event delegation: works for dynamically-added elements
document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); if(el) showTip(el, e); });
document.addEventListener("mousemove", e => { if(TIP().classList.contains("show")) moveTip(e); });
document.addEventListener("mouseout", e => { if(e.target.closest("[data-tip]")) hideTip(); });
document.addEventListener("focusin", e => { const el = e.target.closest("[data-tip]"); if(el) showTip(el, el.getBoundingClientRect()); });
document.addEventListener("focusout", hideTip);

// glossary lookup: case-insensitive, tolerant of unit suffixes like " (/h)"
function tipFor(kind, key){
  if(!GLOSSARY || !key) return "";
  const clean = String(key).replace(/\s*\(.*?\)\s*$/, "").trim();  // drop "(…)"
  const bucket = GLOSSARY[kind] || {};
  const hit = bucket[clean] || bucket[key] || (GLOSSARY.flat||{})[clean.toLowerCase()];
  return hit ? `<b>${clean}</b> — ${hit}` : "";
}
function setTip(el, kind, key){ const x = tipFor(kind, key); if(x){ el.setAttribute("data-tip", x); el.classList.add("info"); } }

// ---- reference ranges / abnormal flagging ----
function refFor(key){
  if(!GLOSSARY || !GLOSSARY.ranges || key==null) return null;
  const clean = String(key).replace(/\s*\(.*?\)\s*$/, "").trim();
  return GLOSSARY.ranges[clean] || GLOSSARY.ranges[key] || null;
}
// returns {abnormal:bool, side:'high'|'low'|null, severity:string|null} for a value vs a ref
function assess(value, ref){
  if(ref==null || value==null || !isFinite(value)) return {abnormal:false};
  const [lo, hi] = ref.normal;
  const dir = ref.direction || "both";
  let abnormal=false, side=null;
  if((dir==="high"||dir==="both") && value > hi){ abnormal=true; side="high"; }
  if((dir==="low" ||dir==="both") && value < lo){ abnormal=true; side="low"; }
  let severity=null;
  if(abnormal && ref.severity){
    for(const [a,b,name] of ref.severity){ if(value>=a && value<b){ severity=name; break; } }
  }
  return {abnormal, side, severity};
}
// build a tooltip combining the definition + normal range (+ abnormal note)
function rangeTip(defKind, key, value){
  const parts = [];
  const def = tipFor(defKind, key); if(def) parts.push(def);
  const ref = refFor(key);
  if(ref){
    const [lo,hi] = ref.normal;
    parts.push(`<b>Normal:</b> ${lo}–${hi} ${ref.unit||''}`);
    const a = assess(value, ref);
    if(a.abnormal){
      const arrow = a.side==="high" ? "above" : "below";
      const sev = a.severity ? ` (${a.severity})` : "";
      parts.push(`<span style="color:#ff9ba6"><b>Abnormal${sev}</b> — ${arrow} normal. ${ref.abnormal||''}</span>`);
    }
  }
  return parts.join("<br>");
}

// ---- dataset selector ----
async function loadDatasets(){
  try {
    const d = await jget("/api/datasets");
    DATASETS = d.datasets || [];
    DATASET = d.default || (DATASETS[0] && DATASETS[0].key) || "standard";
  } catch(e){ DATASETS = [{key:"standard",label:"Standard"}]; DATASET = "standard"; }
  const sel = $("#dsSel"); sel.innerHTML = "";
  for(const ds of DATASETS){
    const o = document.createElement("option");

const STAGE_COLORS = {Wake:"var(--wake)",N1:"var(--n1)",N2:"var(--n2)",N3:"var(--n3)",REM:"var(--rem)"};
function stagePctBar(stage_pct){

function preprocBanner(d){

// ---- per-patient sleep dynamics report ----
// Sequential blue ramp (white -> --blue #2166a0) for the transition heatmap:
// magnitude encoded by fill darkness, exact % printed in every cell.
function heatColor(p){                       // p in 0..1
  const t = Math.max(0, Math.min(1, p));
  const r = Math.round(255 + (0x21-255)*t);
  const g = Math.round(255 + (0x66-255)*t);
  const b = Math.round(255 + (0xa0-255)*t);
  return `rgb(${r},${g},${b})`;
}
// Build a labelled NxN heatmap grid. `cellSpec(i,j)` returns
// {norm:0..1 (fill darkness), text, tip (HTML), muted?:bool}.
function matrixHeatmap(order, cellSpec){
  const grid = div("matrix");
  grid.style.gridTemplateColumns = `72px repeat(${order.length}, 1fr)`;
  grid.appendChild(cellEl("corner", "from ↓ / to →"));
  for(const s of order) grid.appendChild(cellEl("mh", s));
  for(let i=0;i<order.length;i++){
    grid.appendChild(cellEl("mrl", order[i]));
    for(let j=0;j<order.length;j++){
      const spec = cellSpec(i,j);
      const cell = cellEl("mcell", spec.text);
      cell.style.background = spec.muted ? "var(--surface)" : heatColor(spec.norm);
      cell.style.color = spec.muted ? "var(--muted)" : (spec.norm>0.55 ? "#fff" : "var(--ink)");
      if(spec.tip) cell.setAttribute("data-tip", spec.tip);
      grid.appendChild(cell);
    }
  }
  return grid;
}
function fmtNum(v){ return (v==null||!isFinite(v)) ? "—" : (Math.round(v*100)/100); }
// worse=true -> higher is worse; false -> lower is worse; null -> neutral.
function cmpArrow(value, cohort, worse){
  if(value==null||cohort==null||!isFinite(value)||worse==null) return {cls:"",arrow:"",worse:false};
  const hi = value > cohort, lo = value < cohort;
  if(!hi && !lo) return {cls:"",arrow:"≈",worse:false};
  const bad = worse ? hi : lo;             // worse-than-cohort direction
  return {cls: bad?"bad":"ok", arrow: hi?"▲":"▼", worse: bad};
}
function dynamicsCard(d){
  const c = div("card");
  if(d && d.error){ c.innerHTML = `<h2>Sleep dynamics</h2><div class="err">${d.error}</div>`; return c; }
  if(!d || !d.ok){ c.innerHTML = `<h2>Sleep dynamics</h2><div class="hint">No stage-transition data for this recording.</div>`; return c; }
  c.innerHTML = `<h2>Sleep dynamics — stage transitions &amp; fragmentation</h2>`;

  // raw is always present (top-level == raw for back-compat); clean is present
  // when preprocessing ran. Default to the preprocessed view.
  const raw = d.raw || d;
  const clean = (d.clean && d.clean.ok) ? d.clean : null;
  const body = div(""); body.style.marginTop = "4px";
  if(clean){
    const tabs = div("tabs");
    const note = div("mcap");
    for(const [v,label] of [["clean","Preprocessed"],["raw","Raw"]]){
      const btn = document.createElement("button"); btn.textContent = label; btn.dataset.v = v;
      btn.onclick = () => renderDyn(v);
      tabs.appendChild(btn);
    }
    c.appendChild(tabs);
    c.appendChild(note);
    c.appendChild(body);
    function renderDyn(view){
      [...tabs.children].forEach(b=>b.classList.toggle("on", b.dataset.v===view));
      note.innerHTML = view==="clean"
        ? `Computed on the <b>preprocessed</b> hypnogram (single-epoch spikes shorter than ${d.min_bout_min} min merged away). Fragmentation and transition counts drop versus raw — the counts below reflect biologically plausible stage changes.`
        : `Computed on the <b>raw</b> CAISR staging (as scored, no smoothing).`;
      dynamicsBody(body, view==="clean" ? clean : raw);
    }
    renderDyn("clean");
  } else {
    c.appendChild(body);
    dynamicsBody(body, raw);
  }
  return c;
}
// Render the matrices + tiles for one dynamics view (raw or clean) into `box`.
function dynamicsBody(box, d){
  box.innerHTML = "";
  const matTip = tipFor('dynamics','transition matrix');
  const order = d.stage_order;              // [Wake,N1,N2,N3,REM]

  // --- (1) transition probability heatmap (rows sum to 100%) ---
  const h3 = document.createElement("h3");
  h3.textContent = "Stage-to-stage transition probability";
  if(matTip){ h3.className="info"; h3.setAttribute("data-tip", matTip); }
  box.appendChild(h3);
  box.appendChild(matrixHeatmap(order, (i,j)=>{
    const p = d.transition_pct[i][j], coh = d.cohort_pct[i][j];
    const delta = (p-coh>=0?"+":"") + Math.round((p-coh)*10)/10;
    return { norm: p/100, text: p>=0.5? p+"%" : (p>0? "<1%":"0"),
             tip: `<b>${order[i]} → ${order[j]}</b><br>This patient: ${p}%<br>Cohort mean: ${coh}%<br>Δ ${delta} pp vs cohort` };
  }));
  const cap = div("mcap");
  cap.textContent = `Each row sums to 100%. Darker = more likely. Hover a cell to compare with the cohort mean. Sleep time ≈ ${d.tst_hours} h.`;
  box.appendChild(cap);

  // --- (2) transition COUNT heatmap, diagonal zeroed (self-transitions removed
  // so the actual stage changes carry the colour scale) ---
  if(d.transition_counts){
    const counts = d.transition_counts;
    let cmax = 0;
    for(let i=0;i<order.length;i++) for(let j=0;j<order.length;j++)
      if(i!==j) cmax = Math.max(cmax, counts[i][j]);
    const h3b = document.createElement("h3");
    h3b.textContent = "Number of transitions (self-transitions zeroed)";
    box.appendChild(h3b);
    box.appendChild(matrixHeatmap(order, (i,j)=>{
      if(i===j) return { norm: 0, text: "—", muted: true,
        tip: `<b>${order[i]} → ${order[i]}</b><br>Self-transition (stage stays) — zeroed here to highlight actual stage changes.` };
      const n = counts[i][j];
      return { norm: cmax? n/cmax : 0, text: String(n),
        tip: `<b>${order[i]} → ${order[j]}</b><br>${n} transition${n===1?'':'s'} across the night` };
    }));
    const cap2 = div("mcap");
    cap2.textContent = "Raw count of each stage change over the whole recording. The diagonal (stage → itself) is set to zero so the off-diagonal moves dominate the colour scale.";
    box.appendChild(cap2);
  }

  // --- fragmentation tiles ---
  box.appendChild(dynSection("Fragmentation & spikes (vs cohort mean)", d.fragmentation));
  // --- named transition rates ---
  const named = d.named_transitions.map(n=>({...n, higher_is_worse:null}));
  box.appendChild(dynSection("Key transition rates (per hour of sleep)", named));
}
function dynSection(title, items){
  const wrap = div("");
  const h = document.createElement("h3"); h.textContent = title; wrap.appendChild(h);
  const g = div("dyn-grid");
  for(const it of items){
    const cmp = cmpArrow(it.value, it.cohort, it.higher_is_worse);
    const tile = div("dyn" + (cmp.worse?" worse":""));
    const tip = tipFor('dynamics', it.key);
    if(tip){ tile.classList.add("info"); tile.setAttribute("data-tip", tip); }
    const unit = it.unit==="count" ? "" : " "+it.unit;
    const arrow = cmp.arrow ? ` <span class="arrow ${cmp.cls}">${cmp.arrow}</span>` : "";
    tile.innerHTML = `<div class="n">${fmtNum(it.value)}${unit}${arrow}</div>`+
                     `<div class="l">${it.label}</div>`+
                     `<div class="c">cohort ${fmtNum(it.cohort)}${unit}</div>`;
    g.appendChild(tile);
  }
  wrap.appendChild(g);
  return wrap;
}
function cellEl(cls, text){ const d=div(cls); d.textContent=text; return d; }

// `ghost` (optional): a second hypnogram drawn faintly behind `hyp` — used in
// the Compare view to show the raw trace under the preprocessed one, so the
// epochs that changed are visible as the gap between grey (raw) and blue (clean).
function hypnogramSVG(hyp, ghost){
  const W = 900, H = 150, padL = 46, padR = 12, padT = 10, padB = 22;
  const svg = svgEl("svg",{viewBox:`0 0 ${W} ${H}`}); svg.style.marginTop="10px";
  if(!hyp || !hyp.length){ return svg; }
  const tmax = hyp[hyp.length-1].t_min || 1;
  const ymap = {4:"Wake",3:"REM",2:"N1",1:"N2",0:"N3"};
  const x = t => padL + (t/tmax)*(W-padL-padR);
  const y = v => padT + (4-v)/4*(H-padT-padB);
  // enclosing frame so the trace's start/end are clearly bounded
  svg.appendChild(svgEl("rect",{x:padL,y:padT,width:W-padL-padR,height:H-padT-padB,
    fill:"none",stroke:"var(--axis)","stroke-width":1}));
  // gridlines + stage labels
  for(let v=0; v<=4; v++){
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:y(v),y2:y(v),stroke:"var(--grid)","stroke-width":1}));
    svg.appendChild(txt(padL-8, y(v)+3, ymap[v], {"text-anchor":"end", class:"axis-label"}));
  }
  const stepPath = pts => {
    let d = "", prev = null;
    pts.forEach(p=>{ const X=x(p.t_min);
      if(p.y < 0){ prev = null; return; }         // Unknown -> gap
      const Y = y(p.y);
      d += (prev === null) ? `M${X},${Y}` : ` L${X},${prev} L${X},${Y}`;
      prev = Y; });
    return d;
  };
  // ghost (raw) trace first, faint, so the blue clean trace sits on top
  if(ghost && ghost.length){
    svg.appendChild(svgEl("path",{d:stepPath(ghost), fill:"none",
      stroke:"var(--muted)","stroke-width":1, "stroke-opacity":0.55}));
  }
  svg.appendChild(svgEl("path",{d:stepPath(hyp), fill:"none", stroke:"var(--blue)","stroke-width":1.5}));
  // REM overlay dots
  hyp.forEach(p=>{ if(p.stage==="REM"){ svg.appendChild(svgEl("circle",{cx:x(p.t_min),cy:y(p.y),r:1.3,fill:"var(--rem)"})); }});
  // x axis ticks (hours)
  const hrs = Math.ceil(tmax/60);
  for(let h=0; h<=hrs; h++){ const X=x(h*60);
    svg.appendChild(txt(X, H-6, h+"h", {"text-anchor":"middle", class:"axis-label"})); }
  return svg;
}

let SELECTED_CH = ["C4-M1","EKG","SaO2","stage"]; // defaults if present
let SIG_DUR = null;        // full recording duration (s)
let SIG_WIN = null;        // current zoom window [t0,t1] in s, or null = full night

async function loadSignals(){
  SIG_WIN = null;
  const d = await jget(api("/api/signals", "bids="+encodeURIComponent(CURRENT))); // no ch -> labels only
  SIG_DUR = d.duration_s || null;

async function fetchChannels(labels){
  // cache key includes the zoom window so panning/zooming caches independently
  const winKey = SIG_WIN ? `${SIG_WIN[0].toFixed(1)}-${SIG_WIN[1].toFixed(1)}` : "full";
  const key = DATASET + "|" + winKey + "|" + labels.join("|");
  if(SIGCACHE[key]) return SIGCACHE[key];
  let qs = "bids="+encodeURIComponent(CURRENT)+"&"+labels.map(l=>"ch="+encodeURIComponent(l)).join("&");
  if(SIG_WIN) qs += `&t0=${SIG_WIN[0]}&t1=${SIG_WIN[1]}`;
  const d = await jget(api("/api/signals", qs));
  SIGCACHE[key] = d; return d;
}
const MIN_WIN_S = 0.1;   // finest zoom: 0.1 s window -> individual sample detail
// apply a new zoom window (clamped) and redraw
function setSigWindow(t0, t1){
  if(SIG_DUR==null) return;
  let a = Math.max(0, Math.min(t0, t1)), b = Math.min(SIG_DUR, Math.max(t0, t1));
  if(b - a < MIN_WIN_S){                            // enforce a floor, keep centre
    const c = (a+b)/2; a = c - MIN_WIN_S/2; b = c + MIN_WIN_S/2;
    a = Math.max(0, a); b = Math.min(SIG_DUR, Math.max(a+MIN_WIN_S, b));
  }
  SIG_WIN = (a<=0 && b>=SIG_DUR) ? null : [Math.round(a*1000)/1000, Math.round(b*1000)/1000];
  drawSelected();
}
// zoom by `factor` (<1 = in, >1 = out) around a time `centre` (default: window mid)
function zoomAround(factor, centre){
  const [a,b] = SIG_WIN || [0, SIG_DUR||0];
  const c = (centre==null) ? (a+b)/2 : Math.max(a, Math.min(b, centre));
  const half = (b-a)*factor/2;
  setSigWindow(c - half, c + half);
}
function zoomIn(centre){ zoomAround(0.5, centre); }
function zoomOut(centre){ if(SIG_WIN) zoomAround(2, centre); }
function resetZoom(){ SIG_WIN = null; drawSelected(); }
function fmtDur(s){ if(s>=3600) return (s/3600).toFixed(2)+" h"; if(s>=60) return (s/60).toFixed(1)+" min"; return s.toFixed(1)+" s"; }
function updateSigBar(){
  const bar = $("#sigbar"); if(!bar) return;
  bar.style.display = "flex";
  const win = SIG_WIN || [0, SIG_DUR||0];
  $("#sigwin").innerHTML = SIG_WIN
    ? `Window <b>${fmtDur(win[0])} → ${fmtDur(win[1])}</b> (${fmtDur(win[1]-win[0])})`
    : `Whole night (${fmtDur(SIG_DUR||0)})`;

// One channel plot: full frame, y min/mid/max ticks, drag-to-zoom, hover crosshair.
function signalSVG(s, w0, w1){
  const W=900, H=110, padL=56, padR=14, padT=14, padB=22;
  const wrap = div("sigwrap");
  const svg = svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const ys = s.y.filter(v=>v!=null && isFinite(v));
  if(!ys.length){ svg.appendChild(txt(padL, H/2, s.label+" (no data in window)", {class:"sig-label"})); wrap.appendChild(svg); return wrap; }
  let mn=Math.min(...ys), mx=Math.max(...ys); if(mn===mx){mx=mn+1;}
  const pad=(mx-mn)*0.06; mn-=pad; mx+=pad;                 // headroom so peaks aren't clipped
  const t0=w0, t1=(w1>w0?w1:w0+1);
  const X = t => padL + ((t-t0)/(t1-t0))*plotW;
  const Y = v => padT + (1-(v-mn)/(mx-mn))*plotH;
  // frame
  svg.appendChild(svgEl("rect",{x:padL,y:padT,width:plotW,height:plotH,class:"sig-frame"}));
  // y ticks: min / mid / max
  [mn,(mn+mx)/2,mx].forEach(v=>{
    svg.appendChild(svgEl("line",{x1:padL-3,x2:padL,y1:Y(v),y2:Y(v),stroke:"var(--axis)","stroke-width":1}));
    svg.appendChild(txt(padL-6, Y(v)+3, v.toFixed(mx-mn<10?2:0), {"text-anchor":"end", class:"axis-label"}));
  });
  // waveform (clip to frame so nothing spills past the right edge)
  let dpath=""; let started=false;
  for(let i=0;i<s.t.length;i++){ const v=s.y[i]; if(v==null||!isFinite(v)){started=false;continue;}
    const px=X(s.t[i]), py=Y(v); dpath += (started?` L${px},${py}`:`M${px},${py}`); started=true; }
  svg.appendChild(svgEl("path",{d:dpath, fill:"none", stroke:"var(--blue)","stroke-width":1.1}));
  // labels
  svg.appendChild(txt(padL, padT-4, `${s.label}`, {class:"sig-label"}));
  svg.appendChild(txt(W-padR, padT-4, `${mn.toFixed(1)}–${mx.toFixed(1)} ${s.unit||''} · ${s.fs}Hz`, {"text-anchor":"end", class:"axis-label"}));
  // x ticks (a few time marks across the window)
  const xt = niceTicks(t0, t1, 5);
  for(const tv of xt){ svg.appendChild(txt(X(tv), H-6, fmtClock(tv), {"text-anchor":"middle", class:"axis-label"})); }

  attachZoom(svg, {padL, padT, plotW, plotH, t0, t1, X, Y, s, unit:s.unit,
    onWindow:setSigWindow, onReset:resetZoom, onZoom:zoomAround});
  wrap.appendChild(svg); return wrap;
}
// map a time on the concatenated stage timeline back to real night-time (s),
// using the bout position map; returns null if outside all bouts.
function _concatToNight(bouts, ct){
  for(const b of bouts){
    if(ct >= b.concat_start_s - 1e-6 && ct <= b.concat_end_s + 1e-6)
      return b.night_start_s + (ct - b.concat_start_s);
  }
  return null;
}
// nearest in-window sample to time `tv`; returns {t, v} or null (skips gaps)
function _nearestSample(s, tv){
  const T=s.t; if(!T || !T.length) return null;
  let lo=0, hi=T.length-1;
  while(lo<hi){ const m=(lo+hi)>>1; if(T[m]<tv) lo=m+1; else hi=m; }
  let best=null, bd=Infinity;
  for(const i of [lo-1, lo, lo+1]){
    if(i<0 || i>=T.length) continue;
    const v=s.y[i]; if(v==null || !isFinite(v)) continue;
    const d=Math.abs(T[i]-tv); if(d<bd){ bd=d; best={t:T[i], v}; }
  }
  return best;
}
function fmtClock(s){ const m=Math.floor(s/60), sec=Math.round(s%60);
  return (s>=60) ? `${m}:${String(sec).padStart(2,'0')}` : `${s.toFixed(s<10?1:0)}s`; }
function niceTicks(a,b,n){ const step=(b-a)/n, out=[]; for(let i=0;i<=n;i++) out.push(a+step*i); return out; }
// drag-to-zoom brush + hover crosshair on a signal plot. A single module-level
// drag state + one persistent window mouseup handler (installed once) avoids
// leaking a listener on every redraw.
let SIG_DRAG = null;   // {svg, g, startClient, startX, brush}
function _sigToT(svg, g, clientX){
  const r = svg.getBoundingClientRect();
  const vx = (clientX - r.left) / r.width * 900;             // viewBox is 0..900
  const frac = (vx - g.padL) / g.plotW;
  return g.t0 + Math.max(0, Math.min(1, frac)) * (g.t1 - g.t0);
}
function _sigClampX(svg, g, clientX){
  const r = svg.getBoundingClientRect();
  const vx = (clientX - r.left) / r.width * 900;
  return Math.max(g.padL, Math.min(g.padL+g.plotW, vx));
}
if(!window.__sigZoomInit){
  window.__sigZoomInit = true;
  window.addEventListener("mouseup", e=>{
    if(!SIG_DRAG) return;
    const {svg, g, startClient, brush} = SIG_DRAG;
    const a=_sigToT(svg,g,startClient), b=_sigToT(svg,g,e.clientX);
    if(brush && brush.parentNode) brush.parentNode.removeChild(brush);
    SIG_DRAG = null;
    if(Math.abs(b-a) > 0.4) g.onWindow(a,b);                  // real drag -> zoom
  });
}
// `g` carries the plot geometry (padL/padT/plotW/plotH), the view time span
// (t0/t1), the scale fns (X/Y), the data series `s` ({t,y}), the `unit`, and the
// zoom callbacks onWindow(a,b) / onReset() / onZoom(factor,centre) — so this one
// controller drives both the whole-night PSG plots and the per-stage plots.
function attachZoom(svg, g){
  const cross = svgEl("line",{class:"sig-cross",y1:g.padT,y2:g.padT+g.plotH,x1:g.padL,x2:g.padL});
  cross.style.display="none";
  const dot = svgEl("circle",{class:"sig-dot",r:2.6,cx:g.padL,cy:g.padT}); dot.style.display="none";
  const readout = txt(g.padL+2, g.padT+10, "", {class:"sig-readout"}); readout.style.display="none";
  svg.appendChild(cross); svg.appendChild(dot); svg.appendChild(readout);
  const unit = (g.unit || (g.s && g.s.unit) || "").trim();
  svg.addEventListener("mousemove", e=>{
    const vx = _sigClampX(svg,g,e.clientX);
    const tv = _sigToT(svg,g,e.clientX);
    cross.style.display=""; readout.style.display="";
    cross.setAttribute("x1",vx); cross.setAttribute("x2",vx);
    // snap to the nearest real sample so we can report its amplitude value
    const near = _nearestSample(g.s, tv);
    let label = fmtClock(tv);
    if(near){
      const cy = g.Y(near.v);
      dot.style.display=""; dot.setAttribute("cx", g.X(near.t)); dot.setAttribute("cy", cy);
      // for the concatenated-stage plot, also show where in the night this sample is
      const nite = g.bouts ? _concatToNight(g.bouts, near.t) : null;
      const when = nite!=null ? ` @ night ${fmtDur(nite)}` : "";
      label = `${fmtClock(near.t)}${when}  ·  ${near.v.toFixed(2)}${unit?(" "+unit):""}`;
      readout.setAttribute("y", Math.max(g.padT+10, Math.min(g.padT+g.plotH-2, cy-6)));
    } else {
      dot.style.display="none"; readout.setAttribute("y", g.padT+10);
    }
    readout.setAttribute("x", vx+4 > (g.padL+g.plotW-4) ? vx-4 : vx+4);
    readout.setAttribute("text-anchor", vx+4 > (g.padL+g.plotW-4) ? "end" : "start");
    readout.textContent = label;
    if(SIG_DRAG && SIG_DRAG.svg===svg){ const x0=Math.min(SIG_DRAG.startX,vx), w=Math.abs(vx-SIG_DRAG.startX);
      SIG_DRAG.brush.setAttribute("x",x0); SIG_DRAG.brush.setAttribute("width",w); }
  });
  svg.addEventListener("mouseleave", ()=>{ cross.style.display="none"; dot.style.display="none"; readout.style.display="none"; });
  svg.addEventListener("mousedown", e=>{
    const startX=_sigClampX(svg,g,e.clientX);
    const brush=svgEl("rect",{class:"sig-brush",x:startX,y:g.padT,width:0,height:g.plotH});
    svg.appendChild(brush);
    SIG_DRAG = {svg, g, startClient:e.clientX, startX, brush};
    e.preventDefault();
  });
  svg.addEventListener("dblclick", ()=> g.onReset());
  // scroll to zoom, centered on the cursor's time (the natural zoom gesture)
  svg.addEventListener("wheel", e=>{
    e.preventDefault();
    const tv = _sigToT(svg,g,e.clientX);
    g.onZoom(e.deltaY < 0 ? 0.8 : 1.25, tv);        // up = in, down = out
  }, {passive:false});
}

  [mn,(mn+mx)/2,mx].forEach(v=>{
    svg.appendChild(svgEl("line",{x1:padL-3,x2:padL,y1:Y(v),y2:Y(v),stroke:"var(--axis)","stroke-width":1}));
    svg.appendChild(txt(padL-6, Y(v)+3, v.toFixed(mx-mn<10?2:0), {"text-anchor":"end", class:"axis-label"}));
  });
  // bout seams (dashed vertical lines where the concat jumps between night bouts)
  for(const b of (d.bouts||[])){
    const cs = b.concat_start_s;
    if(cs<=t0+1e-6 || cs>=t1) continue;   // skip the very first edge + off-window
    svg.appendChild(svgEl("line",{x1:X(cs),x2:X(cs),y1:padT,y2:padT+plotH,class:"seam"}));
  }
  // waveform
  const col = `var(--${d.color_key})`;
  let dpath="",started=false;
  for(let i=0;i<d.t.length;i++){ const v=d.y[i]; if(v==null||!isFinite(v)){started=false;continue;}
    const px=X(d.t[i]), py=Y(v); dpath += (started?` L${px},${py}`:`M${px},${py}`); started=true; }
  svg.appendChild(svgEl("path",{d:dpath, fill:"none", stroke:col, "stroke-width":1.1}));
  svg.appendChild(txt(padL, padT-4, `${d.stage} — concatenated`, {class:"sig-label"}));
  svg.appendChild(txt(W-padR, padT-4, `${mn.toFixed(1)}–${mx.toFixed(1)} ${d.unit||''} · ${d.fs}Hz`, {"text-anchor":"end", class:"axis-label"}));
  // x ticks along the concatenated timeline
  const xt = niceTicks(t0, t1, 6);
  for(const tv of xt){ svg.appendChild(txt(X(tv), H-6, fmtClock(tv), {"text-anchor":"middle", class:"axis-label"})); }
  attachZoom(svg, {padL, padT, plotW, plotH, t0, t1, X, Y, s:{t:d.t,y:d.y}, unit:d.unit,
    onWindow:fsSetWindow, onReset:()=>{ if(FS_STATE){FS_STATE.win=null; drawFullStage();} }, onZoom:fsZoom,
    bouts:d.bouts});
  wrap.appendChild(svg); return wrap;
}
// small framed 30-s epoch waveform
function epochSVG(ex, color, unit){
  const W=280, H=90, padL=8, padR=8, padT=8, padB=14;
  const svg = svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const ys = ex.y.filter(v=>v!=null && isFinite(v));
  if(!ys.length){ svg.appendChild(txt(padL,H/2,"(no data)",{class:"axis-label"})); return svg; }
  let mn=Math.min(...ys), mx=Math.max(...ys); if(mn===mx) mx=mn+1;
  const pad=(mx-mn)*0.08; mn-=pad; mx+=pad;
  const tmax = ex.t.length? ex.t[ex.t.length-1] : 30;
  const X = t => padL + (t/(tmax||30))*plotW;
  const Y = v => padT + (1-(v-mn)/(mx-mn))*plotH;
  svg.appendChild(svgEl("rect",{x:padL,y:padT,width:plotW,height:plotH,class:"sig-frame"}));
  let d="",started=false;
  for(let i=0;i<ex.t.length;i++){ const v=ex.y[i]; if(v==null||!isFinite(v)){started=false;continue;}
    const px=X(ex.t[i]), py=Y(v); d += (started?` L${px},${py}`:`M${px},${py}`); started=true; }
  svg.appendChild(svgEl("path",{d, fill:"none", stroke:color, "stroke-width":1.1}));
  svg.appendChild(txt(W-padR, padT+8, `${mn.toFixed(1)}–${mx.toFixed(1)}${unit||''}`, {"text-anchor":"end", class:"axis-label"}));
  for(const sec of [0,10,20,30]) svg.appendChild(txt(X(sec), H-4, sec+"s", {"text-anchor":"middle", class:"axis-label"}));
  return svg;
}

// ---- per-stage physiology (NeuroKit): HRV / EEG complexity / respiration ----
// Heaviest computation in the app (~7-8 s: whole-night R-peak detection + HRV),
// so it is loaded on demand behind a button rather than with the other cards.
let NK_BIDS = null;                          // guards against a stale async result
const NK_STAGE_COLS = [                      // which pools to show as table columns
  ["wake","Wake","wake"],["n1","N1","n1"],["n2","N2","n2"],
  ["n3","N3","n3"],["rem","REM","rem"],["nrem","NREM",null],["sleep","Sleep",null]];
function nkCard(){
  const c = div("card"); c.id = "nkcard";
  c.innerHTML = `<h2>Per-stage physiology — HRV · EEG complexity · respiration</h2>
    <p class="nk-sub info" data-tip="${(tipFor('nk','per-stage physiology')||'').replace(/"/g,'&quot;')}">
      Heart-rate variability, EEG complexity, and breathing regularity computed
      <b>within each sleep stage</b> from the raw waveforms (via NeuroKit2). The
      cross-stage contrasts below capture how strongly physiology is modulated
      across stages — a swing that flattens with autonomic dysregulation and
      cognitive decline.</p>
    <div id="nkbody"><button class="nk-btn" id="nkrun">Compute per-stage physiology</button>
      <span class="hint" style="margin-left:10px">takes a few seconds — reads the ECG / EEG / effort waveforms</span></div>`;
  // wire the button after it is in the DOM
  setTimeout(()=>{ const b=$("#nkrun"); if(b) b.onclick = loadNkFeatures; }, 0);
  return c;
}
async function loadNkFeatures(){
  const box = $("#nkbody"); if(!box) return;
  const bids = CURRENT; NK_BIDS = bids;
  box.innerHTML = `<div class="loading">computing HRV, EEG complexity &amp; respiration across stages… (a few seconds)</div>`;
  let d;
  try { d = await jget(api("/api/nk_features", "bids="+encodeURIComponent(bids))); }
  catch(e){ d = {error:String(e)}; }
  if(NK_BIDS !== bids) return;                       // patient changed mid-flight
  if(d.error){ box.innerHTML = `<div class="err">${d.error}</div>`; return; }
  box.innerHTML = "";
  const used = d.channels_used || {};
  const u = div("nk-used");
  u.innerHTML = `channels used — ECG <b>${used.ecg||'—'}</b> · EEG <b>${used.eeg||'—'}</b> · respiratory <b>${used.rsp||'—'}</b>`;
  box.appendChild(u);

  let any = false;
  const ecg = d.ecg;
  if(ecg && ecg.ok){ any = true; box.appendChild(nkHrvSection(ecg)); }
  const eeg = d.eeg;
  if(eeg && eeg.ok){ any = true; box.appendChild(nkEegSection(eeg)); }
  const rsp = d.rsp;
  if(rsp && rsp.ok){ any = true; box.appendChild(nkRspSection(rsp)); }
  if(!any) box.appendChild(Object.assign(div("hint"),
    {textContent:"No ECG / EEG / respiratory channel could be analysed for this recording."}));
}
// Build a per-stage table: `rows` = [[key,label,unit,decimals], …]; `getVal(stageTag,key)`.
function nkTable(stages, rows){
  const cols = NK_STAGE_COLS.filter(([tag])=>stages[tag]);   // only present pools
  const tbl = document.createElement("table"); tbl.className = "nktab";
  let head = `<thead><tr><th></th>`;
  for(const [tag,label,ckey] of cols){
    const bg = ckey ? `var(--${ckey})` : "var(--ink2)";
    head += `<th style="background:${bg}">${label}</th>`;
  }
  head += `</tr></thead>`;
  let body = "<tbody>";
  for(const [key,label,unit,dec] of rows){
    const tip = (tipFor('nk',label)||"").replace(/"/g,'&quot;');
    body += `<tr><th class="rowlab${tip?' info':''}"${tip?` data-tip="${tip}"`:''}>${label}`+
            (unit?` <span class="u">${unit}</span>`:"")+`</th>`;
    for(const [tag] of cols){
      const s = stages[tag] || {};
      const v = s[key];
      body += (v==null||!isFinite(v))
        ? `<td class="na">—</td>`
        : `<td>${(Math.round(v*Math.pow(10,dec))/Math.pow(10,dec)).toFixed(dec)}</td>`;
    }
    body += `</tr>`;
  }
  body += "</tbody>";
  tbl.innerHTML = head + body;
  return tbl;
}
function nkContrastTiles(contrasts, keys){
  const g = div("nk-contrast-grid");
  for(const [key,label,dec] of keys){
    const v = contrasts ? contrasts[key] : null;
    const tile = div("nkc");
    const tip = (tipFor('nk',key)||"").replace(/"/g,'&quot;');
    tile.innerHTML = `<div class="n">${(v==null||!isFinite(v))?"—":(Math.round(v*Math.pow(10,dec))/Math.pow(10,dec))}</div>`+
      `<div class="l${tip?' info':''}"${tip?` data-tip="${tip}"`:''}>${label}</div>`;
    g.appendChild(tile);
  }
  return g;
}
function nkHrvSection(ecg){
  const wrap = div("");
  const h = document.createElement("h3"); h.textContent = "Heart-rate variability by stage (ECG)";
  wrap.appendChild(h);
  const meta = div("nk-used");
  meta.innerHTML = `${ecg.n_beats_clean??'—'} clean beats of ${ecg.n_beats_total??'—'} detected · RR intervals labelled by the stage of each beat`;
  wrap.appendChild(meta);
  wrap.appendChild(nkTable(ecg.stages||{}, [
    ["hr_mean","HR","bpm",1],["rmssd","RMSSD","ms",1],["sdnn","SDNN","ms",1],
    ["pnn50","pNN50","%",1],["lfhf","LF/HF","",2],["sd1sd2","SD1/SD2","",3],
    ["n_beats","beats","",0],
  ]));
  const h2 = document.createElement("h3"); h2.textContent = "Cross-stage HRV contrasts (modulation across stages)";
  wrap.appendChild(h2);
  wrap.appendChild(nkContrastTiles(ecg.contrasts, [
    ["rem_nrem_rmssd_ratio","REM/NREM RMSSD ratio",3],
    ["rem_nrem_lfhf_ratio","REM/NREM LF/HF ratio",3],
    ["rem_nrem_hr_delta","REM−NREM heart rate (bpm)",2],
    ["wake_sleep_hr_delta","Wake−Sleep heart rate (bpm)",2],
    ["n3_wake_rmssd_ratio","N3/Wake RMSSD ratio",3],
    ["stage_hr_range","Stage HR range (bpm)",2],
    ["stage_rmssd_cv","Stage RMSSD variation (CV)",3],
  ]));
  const cap = div("mcap");
  cap.textContent = "A healthy autonomic system swings between high vagal variability in deep sleep and sympathetic dominance in REM/Wake. Ratios near 1 and small ranges indicate a blunted swing — the exploratory cognitive-impairment marker.";
  wrap.appendChild(cap);
  return wrap;
}
function nkEegSection(eeg){
  const wrap = div("");
  const h = document.createElement("h3"); h.textContent = "EEG signal complexity by stage";
  wrap.appendChild(h);
  wrap.appendChild(nkTable(eeg.stages||{}, [
    ["sampen_mean","SampEn","",3],["permen_mean","PermEn","",3],["n_epochs","epochs","",0],
  ]));
  if(eeg.contrasts && Object.keys(eeg.contrasts).length){
    wrap.appendChild(nkContrastTiles(eeg.contrasts, [
      ["n3_wake_sampen_ratio","N3/Wake SampEn ratio",3],
    ]));
  }
  const cap = div("mcap");
  cap.textContent = "Sample & permutation entropy of the EEG within each stage (means over epochs, cost-capped). Complexity is normally lowest in slow-wave N3; reduced complexity is an exploratory marker of cognitive decline.";
  wrap.appendChild(cap);
  return wrap;
}
function nkRspSection(rsp){
  const wrap = div("");
  const h = document.createElement("h3"); h.textContent = "Respiratory rate & variability by stage";
  wrap.appendChild(h);
  wrap.appendChild(nkTable(rsp.stages||{}, [
    ["rate_mean","Rate","/min",2],["rate_sd","Rate SD","/min",2],["rrv_cv","RRV CV","",3],
  ]));
  const cap = div("mcap");
  cap.textContent = "Mean respiratory rate and its variability within each stage, from the effort/airflow belt. Breathing is normally most regular in stable NREM.";
  wrap.appendChild(cap);
  return wrap;
}

// ---- clinical report (Tier-1 / Tier-2 / clinical features + sleep quality) ----
// The summary the team prioritised, assembled server-side from every signal
// domain (HRV / EEG spectral & spindles / oximetry / respiratory events). Heavy
// (~8-14 s), so it loads on demand behind a button like the physiology card.
let REPORT_BIDS = null;
function reportCard(){
  const c = div("card"); c.id = "repcard";
  c.innerHTML = `<h2>Clinical report — prioritised sleep &amp; cognition markers</h2>
    <p class="nk-sub">A single-screen summary of the features the team flagged as
      most relevant to cognitive impairment, computed from this recording's raw
      waveforms and CAISR annotations. <b>Tier&nbsp;1</b> are the primary markers,
      <b>Tier&nbsp;2</b> the supporting ones; the clinical-feature table and
      sleep-quality tiles round it out. Exploratory — not a diagnostic report.</p>
    <div id="repbody"><button class="nk-btn" id="reprun">Generate clinical report</button>
      <span class="hint" style="margin-left:10px">takes ~10 s — reads ECG / EEG / EOG / SpO₂ / effort + annotations</span></div>`;
  setTimeout(()=>{ const b=$("#reprun"); if(b) b.onclick = loadReport; }, 0);
  return c;
}
async function loadReport(){
  const box = $("#repbody"); if(!box) return;
  const bids = CURRENT; REPORT_BIDS = bids;
  box.innerHTML = `<div class="loading">assembling the clinical report across every signal domain… (~10 s)</div>`;
  let d;
  try { d = await jget(api("/api/report", "bids="+encodeURIComponent(bids))); }
  catch(e){ d = {error:String(e)}; }
  if(REPORT_BIDS !== bids) return;                    // patient changed mid-flight
  if(d.error){ box.innerHTML = `<div class="err">${d.error}</div>`; return; }
  if(!d.ok){ box.innerHTML = `<div class="hint">Could not assemble a report for this recording.</div>`; return; }
  box.innerHTML = "";
  const used = d.channels_used || {};
  const u = div("nk-used");
  u.innerHTML = `channels — ECG <b>${used.ecg||'—'}</b> · EEG <b>${used.eeg||'—'}</b> · `+
    `EOG <b>${used.eog||'—'}</b> · SpO₂ <b>${used.spo2||'—'}</b> · effort <b>${used.rsp||'—'}</b>`;
  box.appendChild(u);
  box.appendChild(sleepQualitySection(d.sleep_quality));
  box.appendChild(tierSection("Tier 1 — primary markers", "t1", d.tier1));
  box.appendChild(tierSection("Tier 2 — supporting markers", "t2", d.tier2));
  box.appendChild(clinicalTable(d.clinical));
  box.appendChild(respEventSection(d.detail && d.detail.resp_events));
}
// format a report value at a sensible precision (ratios 2-3 dp, big numbers 0-1)
function repFmt(v){
  if(v==null || !isFinite(v)) return null;
  const a = Math.abs(v);
  if(a===0) return "0";
  if(a < 1) return (Math.round(v*1000)/1000);
  if(a < 10) return (Math.round(v*100)/100);
  if(a < 100) return (Math.round(v*10)/10);
  return Math.round(v);
}
function tierSection(title, cls, items){
  const wrap = div("rep-tier");
  const th = div("th");
  th.innerHTML = `<span class="badge ${cls}">${cls==='t1'?'TIER 1':'TIER 2'}</span>`+
    `<span class="cap">${title.replace(/^Tier \d+ — /,'')}</span>`;
  wrap.appendChild(th);
  const g = div("rep-grid");
  for(const it of (items||[])){
    const tile = div("repc "+cls);
    const val = repFmt(it.value);
    const tip = (tipFor('report', it.key)||"").replace(/"/g,'&quot;');
    tile.innerHTML =
      `<div class="n">${val==null?'<span class="na">—</span>':val}`+
        `${(val!=null && it.unit)?`<span class="u">${it.unit}</span>`:''}</div>`+
      `<div class="l${tip?' info':''}"${tip?` data-tip="${tip}"`:''}>${it.label}</div>`+
      (it.note?`<div class="note">${it.note}</div>`:'');
    g.appendChild(tile);
  }
  wrap.appendChild(g);
  return wrap;
}
function clinicalTable(items){
  const wrap = div("");
  const h = document.createElement("h3"); h.textContent = "Clinical feature summary"; wrap.appendChild(h);
  const tbl = document.createElement("table"); tbl.className = "reptab";
  let body = `<thead><tr><th>Feature</th><th style="text-align:right">Value</th><th>Unit</th></tr></thead><tbody>`;
  for(const it of (items||[])){
    const val = repFmt(it.value);
    const tip = (tipFor('report', it.key)||"").replace(/"/g,'&quot;');
    body += `<tr><td class="feat${tip?' info':''}"${tip?` data-tip="${tip}"`:''}>${it.label}</td>`+
      `<td class="v">${val==null?'—':val}</td><td class="u">${it.unit||''}</td></tr>`;
  }
  body += `</tbody>`;
  tbl.innerHTML = body;
  wrap.appendChild(tbl);
  return wrap;
}
// sleep-quality tiles with abnormal flagging via the reference ranges
const SQ_FIELDS = [
  ["sleep_efficiency_pct","Sleep efficiency","%","sleep_efficiency"],
  ["waso_min","WASO","min","waso"],
  ["sleep_latency_min","Sleep latency","min","sleep_latency"],
  ["rem_latency_min","REM latency","min","rem_latency"],
  ["n3_latency_min","N3 latency","min",null],
  ["n_awakenings","Awakenings","","n_awakenings"],
  ["tst_min","TST","min","tst"],
];
function sleepQualitySection(sq){
  const wrap = div("");
  const h = document.createElement("h3"); h.textContent = "Sleep-quality metrics"; wrap.appendChild(h);
  const g = div("sq-grid");
  sq = sq || {};
  for(const [key,label,unit,refKey] of SQ_FIELDS){
    const v = sq[key];
    const tile = div("sq");
    const ref = refKey ? refFor(refKey) : null;
    const a = assess(v==null?null:Number(v), ref);
    if(a.abnormal) tile.classList.add("abn");
    // tooltip: prefer the report glossary label text, fall back to metric ranges
    let tip = tipFor('report', label) || (refKey ? rangeTip('metric', refKey, v==null?null:Number(v)) : "");
    tip = (tip||"").replace(/"/g,'&quot;');
    tile.innerHTML = `<div class="n">${v==null?'—':repFmt(Number(v))}${(v!=null&&unit)?`<span style="font-size:11px;color:var(--muted)"> ${unit}</span>`:''}</div>`+
      `<div class="l${tip?' info':''}"${tip?` data-tip="${tip}"`:''}>${label}</div>`;
    g.appendChild(tile);
  }
  wrap.appendChild(g);
  return wrap;
}
// respiratory-event detail: counts, durations, recovery
function respEventSection(re){
  const wrap = div("");
  if(!re || !re.ok) return wrap;
  const h = document.createElement("h3"); h.textContent = "Respiratory events — counts, durations & recovery";
  wrap.appendChild(h);
  const g = div("rep-grid");
  const tiles = [
    ["ahi","AHI","/h","ahi"],["rdi","RDI","/h",null],
    ["n_obstructive_apnea","Obstructive apneas","",null],
    ["n_central_apnea","Central apneas","",null],
    ["n_hypopnea","Hypopneas","",null],
    ["event_dur_mean_s","Event duration (mean)","s","event_duration"],
    ["event_dur_max_s","Event duration (max)","s","event_duration"],
    ["post_event_overshoot","Post-event SpO₂ overshoot","%","post_event_overshoot"],
    ["resp_recovery_time_s","Respiratory recovery time","s","resp_recovery_time_s"],
  ];
  for(const [key,label,unit,gk] of tiles){
    const v = re[key];
    const tile = div("repc");
    const tip = (gk?tipFor('report', gk):"").replace(/"/g,'&quot;');
    const val = repFmt(v);
    tile.innerHTML = `<div class="n">${val==null?'<span class="na">—</span>':val}${(val!=null&&unit)?`<span class="u">${unit}</span>`:''}</div>`+
      `<div class="l${tip?' info':''}"${tip?` data-tip="${tip}"`:''}>${label}</div>`;
    g.appendChild(tile);
  }
  wrap.appendChild(g);
  return wrap;
}

// ---- svg helpers ----
function div(cls){ const d=document.createElement("div"); if(cls)d.className=cls; return d; }
function svgEl(tag, attrs){ const e=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function txt(x,y,s,attrs){ const t=svgEl("text",Object.assign({x,y},attrs||{})); t.textContent=s; return t; }

async function boot(){
  try { GLOSSARY = await jget("/api/glossary"); } catch(e){ GLOSSARY = null; }
  await loadDatasets();
  await loadPatients();
}
boot();
</script>
